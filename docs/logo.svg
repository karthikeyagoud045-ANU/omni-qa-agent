<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#334155" stroke-width="1.5" />
  <!-- Radar circles -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="#475569" stroke-width="1.5" />
  <circle cx="50" cy="50" r="12" fill="none" stroke="#64748b" stroke-width="1.5" />
  <!-- Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#334155" stroke-width="1" />
  <line x1="12" y1="50" x2="88" y2="50" stroke="#334155" stroke-width="1" />
  <!-- Radar sweep -->
  <path d="M50 50 L75 30 A32 32 0 0 0 50 18 Z" fill="url(#accent)" opacity="0.4" />
  <!-- Target Blip -->
  <circle cx="68" cy="35" r="4" fill="#10b981" />
  <circle cx="68" cy="35" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
</svg>
